<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
    }

    :root {
      /* TEMA PADRÃO / FAUSTINO */
      --bg: #111111;
      --agenda-bg: #111111;
      --text: #e9decf;
      --muted: #cdbfad;
      --primary: #355239;
      --border: #5a2326;
      --card: #0b0b0b;
      --button-text: #e9decf;
      --selected-shadow: rgba(233, 222, 207, 0.18);

      /* FORMATO PADRÃO */
      --day-width: 100%;
      --day-height: 32px;
      --day-radius: 10px;
      --button-radius: 14px;
      --nav-radius: 10px;
    }

    /* TEMA LUMA BEAUTY STUDIO */
    body.cliente-luma {
      --bg: #efdedd;
      --agenda-bg: #efdedd;

      --text: #121212;
      --muted: #fcf6ea;

      --primary: #121212;
      --card: #c4918b;

      --border: transparent;
      --button-text: #f6f0eb;
      --selected-shadow: rgba(18, 18, 18, 0.14);

      /* DATAS EM CÍRCULO MENOR */
      --day-width: 31px;
      --day-height: 31px;
      --day-radius: 999px;

      /* BOTÕES REDONDOS */
      --button-radius: 999px;
      --nav-radius: 999px;
    }

  /* TEMA PETSHOP */
body.cliente-petshop {
  --bg: #c3c398;
  --agenda-bg: #c3c398;

  --text: #121212;
  --muted: #3f4a3c;

  /* data selecionada */
  --primary: #185854;

  /* datas livres */
  --card: #d97558;

  /* sem contorno nas datas */
  --border: transparent;

  --button-text: #fcf6ea;
  --selected-shadow: rgba(24, 88, 84, 0.14);

  /* DATAS EM CÍRCULO IGUAL LUMA */
  --day-width: 31px;
  --day-height: 31px;
  --day-radius: 999px;

  /* BOTÕES REDONDOS */
  --button-radius: 999px;
  --nav-radius: 999px;
}

/* DATAS INATIVAS / PREENCHIDAS */
body.cliente-petshop .day.disabled {
  background: #fcf6ea;
  color: #121212;
  opacity: 1;
}

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: 'Open Sans', Arial, sans-serif;
      color: var(--text);
    }

    .agenda {
      width: 100%;
      max-width: 342px;
      margin: 0 auto;
      padding: 8px 6px 10px;
      background: var(--agenda-bg);
      overflow: hidden;
    }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .month-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      text-transform: capitalize;
      text-align: center;
      flex: 1;
      line-height: 1.2;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--nav-radius);
      border: none;
      background: var(--primary);
      color: var(--button-text);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 5px;
    }

    .weekday {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      line-height: 1.2;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 10px;
      width: 100%;
      overflow: hidden;
    }

    .day {
      width: var(--day-width);
      height: var(--day-height);
      justify-self: center;
      border-radius: var(--day-radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .day.empty {
      visibility: hidden;
    }

    .day.disabled {
      opacity: 0.22;
      cursor: not-allowed;
    }

    .day.selected {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--button-text);
      box-shadow: 0 0 0 2px var(--selected-shadow) inset;
    }

    .selected-label {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--text);
      font-weight: 800;
      line-height: 1.2;
    }

    .horarios {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .horario {
      height: 44px;
      border-radius: var(--button-radius);
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .horario.selecionado {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--button-text);
    }

    .confirmar {
      width: 100%;
      margin-top: 10px;
      height: 46px;
      border: none;
      border-radius: var(--button-radius);
      background: var(--primary);
      color: var(--button-text);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }

    .texto-trocar {
      margin: 16px auto 10px;
      max-width: 285px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      text-align: center;
    }

    .trocar-profissional {
      width: 100%;
      height: 46px;
      border: 1.5px solid var(--primary);
      border-radius: var(--button-radius);
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .trocar-profissional:hover {
      background: var(--primary);
      color: var(--button-text);
    }

    .mensagem {
      margin: 10px 0 0;
      text-align: center;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      display: none;
    }

    .aviso {
      grid-column: 1 / -1;
      color: var(--muted);
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }
  </style>
</head>

<body>
  <div class="agenda">
    <div class="month-header">
      <button class="nav-btn" id="prevMonth">‹</button>
      <div class="month-title" id="monthTitle"></div>
      <button class="nav-btn" id="nextMonth">›</button>
    </div>

    <div class="weekdays">
      <div class="weekday">SEG</div>
      <div class="weekday">TER</div>
      <div class="weekday">QUA</div>
      <div class="weekday">QUI</div>
      <div class="weekday">SEX</div>
      <div class="weekday">SÁB</div>
      <div class="weekday">DOM</div>
    </div>

    <div class="calendar" id="calendar"></div>

    <p class="selected-label" id="selectedLabel"></p>

    <div class="horarios" id="horarios"></div>

    <button class="confirmar" id="confirmar">Confirmar horário</button>

    <p class="texto-trocar" id="textoTrocar">
      Não encontrou o horário que queria?<br>
      Você pode escolher outra data no calendário ou trocar de profissional.
    </p>

    <button class="trocar-profissional" id="trocarProfissional">
      Trocar profissional
    </button>

    <p class="mensagem" id="mensagem"></p>
  </div>

  <script>
    const N8N_BUSCAR_HORARIOS = "https://bot-n8n.k474gt.easypanel.host/webhook/buscar-horarios";

    const params = new URLSearchParams(window.location.search);

    const dadosTypebot = {
      cliente: params.get("cliente") || "",
      servico: params.get("servico") || "",
      barbeiro: params.get("barbeiro") || "",
      nome: params.get("nome") || "",
      telefone: params.get("telefone") || "",
      nome_pet: params.get("nome_pet") || ""
    };

    const clienteAtual = dadosTypebot.cliente.toLowerCase().trim();
    const temaAtual = (params.get("tema") || "").toLowerCase().trim();
    const trocar = (params.get("trocar") || "sim").toLowerCase().trim();

    if (clienteAtual === "luma") {
      document.body.classList.add("cliente-luma");
    }

    if (temaAtual === "petshop" || clienteAtual.includes("pet")) {
      document.body.classList.add("cliente-petshop");
    }

    const calendar = document.getElementById("calendar");
    const monthTitle = document.getElementById("monthTitle");
    const horariosContainer = document.getElementById("horarios");
    const selectedLabel = document.getElementById("selectedLabel");
    const confirmar = document.getElementById("confirmar");
    const mensagem = document.getElementById("mensagem");
    const trocarProfissional = document.getElementById("trocarProfissional");
    const textoTrocar = document.getElementById("textoTrocar");

    if (trocar === "nao") {
      trocarProfissional.style.display = "none";

      if (textoTrocar) {
        textoTrocar.innerHTML = "Não encontrou o horário que queria?<br>Você pode escolher outra data no calendário.";
      }
    }

    const prevMonth = document.getElementById("prevMonth");
    const nextMonth = document.getElementById("nextMonth");

    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);

    let mesAtual = hoje.getMonth();
    let anoAtual = hoje.getFullYear();
    let dataSelecionada = new Date(hoje);
    let horarioSelecionado = "";

    const nomesMeses = [
      "janeiro", "fevereiro", "março", "abril", "maio", "junho",
      "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
    ];

    function formatarDataBR(data) {
      return data.toLocaleDateString("pt-BR", {
        weekday: "long",
        day: "2-digit",
        month: "2-digit"
      });
    }

    function dataISO(data) {
      const ano = data.getFullYear();
      const mes = String(data.getMonth() + 1).padStart(2, "0");
      const dia = String(data.getDate()).padStart(2, "0");
      return `${ano}-${mes}-${dia}`;
    }

    function renderizarCalendario() {
      calendar.innerHTML = "";
      monthTitle.textContent = `${nomesMeses[mesAtual]} ${anoAtual}`;

      const primeiroDia = new Date(anoAtual, mesAtual, 1);
      const ultimoDia = new Date(anoAtual, mesAtual + 1, 0);
      const espacosAntes = (primeiroDia.getDay() + 6) % 7;

      for (let i = 0; i < espacosAntes; i++) {
        const vazio = document.createElement("button");
        vazio.className = "day empty";
        calendar.appendChild(vazio);
      }

      for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
        const data = new Date(anoAtual, mesAtual, dia);
        data.setHours(0, 0, 0, 0);

        const botao = document.createElement("button");
        botao.className = "day";
        botao.textContent = dia;

        const passado = data < hoje;
        const domingo = data.getDay() === 0;

        if (passado || domingo) {
          botao.classList.add("disabled");
        }

        if (dataISO(data) === dataISO(dataSelecionada)) {
          botao.classList.add("selected");
        }

        botao.addEventListener("click", () => {
          if (passado || domingo) return;

          dataSelecionada = data;
          horarioSelecionado = "";
          confirmar.style.display = "none";
          mensagem.style.display = "none";

          renderizarCalendario();
          carregarHorarios();
        });

        calendar.appendChild(botao);
      }
    }

    async function carregarHorarios() {
      horariosContainer.innerHTML = "<p class='aviso'>Carregando horários...</p>";
      selectedLabel.textContent = formatarDataBR(dataSelecionada);
      confirmar.style.display = "none";

      try {
        const resposta = await fetch(N8N_BUSCAR_HORARIOS, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            cliente: dadosTypebot.cliente,
            data: dataISO(dataSelecionada),
            data_formatada: formatarDataBR(dataSelecionada),
            servico: dadosTypebot.servico,
            barbeiro: dadosTypebot.barbeiro,
            nome: dadosTypebot.nome,
            telefone: dadosTypebot.telefone,
            nome_pet: dadosTypebot.nome_pet
          })
        });

        const dados = await resposta.json();
        const horarios = dados.horarios || [];

        renderizarHorarios(horarios);
      } catch (erro) {
        horariosContainer.innerHTML = "<p class='aviso'>Erro ao carregar horários.</p>";
      }
    }

    function renderizarHorarios(horarios) {
      horariosContainer.innerHTML = "";

      if (!horarios.length) {
        horariosContainer.innerHTML = "<p class='aviso'>Sem horários disponíveis nesse dia.</p>";
        return;
      }

      horarios.forEach((hora) => {
        const botao = document.createElement("button");
        botao.className = "horario";
        botao.textContent = hora;

        botao.addEventListener("click", () => {
          document.querySelectorAll(".horario").forEach((item) => {
            item.classList.remove("selecionado");
          });

          botao.classList.add("selecionado");
          horarioSelecionado = hora;

          confirmar.textContent = "Confirmar " + hora;
          confirmar.style.display = "block";
          mensagem.style.display = "none";
        });

        horariosContainer.appendChild(botao);
      });
    }

    prevMonth.addEventListener("click", () => {
      const mesAnterior = new Date(anoAtual, mesAtual - 1, 1);

      if (
        mesAnterior.getFullYear() < hoje.getFullYear() ||
        (mesAnterior.getFullYear() === hoje.getFullYear() && mesAnterior.getMonth() < hoje.getMonth())
      ) {
        return;
      }

      mesAtual--;

      if (mesAtual < 0) {
        mesAtual = 11;
        anoAtual--;
      }

      renderizarCalendario();
      carregarHorarios();
    });

    nextMonth.addEventListener("click", () => {
      mesAtual++;

      if (mesAtual > 11) {
        mesAtual = 0;
        anoAtual++;
      }

      renderizarCalendario();
      carregarHorarios();
    });

    confirmar.addEventListener("click", () => {
      if (!horarioSelecionado) return;

      const textoFinal = formatarDataBR(dataSelecionada) + " às " + horarioSelecionado;

      mensagem.textContent = "Horário selecionado: " + textoFinal;
      mensagem.style.display = "block";

      window.parent.postMessage(
        {
          name: "horario_confirmado",
          data: textoFinal
        },
        "*"
      );
    });

    trocarProfissional.addEventListener("click", () => {
      window.parent.postMessage(
        {
          name: "horario_confirmado",
          data: "TROCAR_BARBEIRO"
        },
        "*"
      );
    });

    renderizarCalendario();
    carregarHorarios();
  </script>
</body>
</html>
